experiment:
  name: phase2_feedback_regeneration_500
  seed: 42

model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto

input:
  phase1_results_path: /mnt/hdd/project_sLM_planning/output/direct_500_stdin/results.jsonl

  # null = 모든 eligible failure
  limit: 500

  # null = 모든 난이도
  difficulties: null

  # null = EXCLUDED_STATUSES를 제외한 모든 failure status
  include_statuses: null

  # input / expected / actual 등 각 feedback field 최대 문자 수
  max_feedback_chars: 2000

strategy:
  name: feedback_regeneration
  prompt_path: prompts/feedback_regeneration.txt
  system_prompt: null

generation:
  # Phase 1과 동일
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0

evaluation:
  timeout_seconds: 5.0

output:
  path: /mnt/hdd/project_sLM_planning/output/phase2_feedback_regeneration_500/results.jsonl
  resume: true