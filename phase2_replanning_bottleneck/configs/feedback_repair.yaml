experiment:
  name: phase2_feedback_repair
  seed: 42

# Phase 2는 데이터셋을 다시 읽지 않고, Phase 1 direct 실행의
# 실패 trajectory를 initial state의 source of truth로 사용한다.
phase1_source:
  results_path: /mnt/hdd/project_sLM_planning/output/direct_500_stdin/results.jsonl
  dataset_name: livecodebench_v6
  limit: null                  # null = 실패 케이스 전체
  difficulties: null           # 예: ["easy", "medium"]
  max_feedback_chars: 2000     # feedback 텍스트 절단 기준

model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true

generation:
  code_max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0

strategy:
  name: feedback_repair
  prompt_path: prompts/feedback_repair.txt
  system_prompt: >
    You are an expert competitive programming assistant.
    Fix the given Python solution using the execution feedback.

evaluation:
  timeout_seconds: 5.0
  include_public_tests: true
  include_private_tests: true

output:
  path: /mnt/hdd/project_sLM_planning/output/phase2/feedback_repair_500/results.jsonl
  resume: true
