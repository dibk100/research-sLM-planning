# phase4_method_discovery/vanilla_planning_rlvr/configs/verl_grpo_signal_smoke.yaml

defaults:
  - ppo_trainer
  - _self_

# =============================================================================
# Data
# =============================================================================

data:
  train_files:
    - /mnt/hdd/project_sLM_planning/data/deepcoder_taco/processed/vanilla_planning_rlvr/grpo_signal_smoke.parquet

  val_files:
    - /mnt/hdd/project_sLM_planning/data/deepcoder_taco/processed/vanilla_planning_rlvr/val.parquet

  train_batch_size: 1
  val_batch_size: 1

  max_prompt_length: 2048
  max_response_length: 512

  shuffle: false
  validation_shuffle: false

  dataloader_num_workers: 0

  filter_overlong_prompts: true
  truncation: error

# =============================================================================
# Planner actor + rollout
# =============================================================================
# FSDP actor attention   = sdpa
# vLLM rollout attention = FLASHINFER (set in run_grpo_smoke.sh)
# use_remove_padding     = false

actor_rollout_ref:

  model:
    path: Qwen/Qwen2.5-Coder-3B-Instruct
    tokenizer_path: Qwen/Qwen2.5-Coder-3B-Instruct
    trust_remote_code: true

    enable_gradient_checkpointing: true
    use_remove_padding: false

    override_config:
      attn_implementation: sdpa

    # -----------------------------------------------------------------
    # Planner LoRA
    # -----------------------------------------------------------------
    lora_rank: 16
    lora_alpha: 32

    # verl / PEFT supported default.
    # For the first feasibility smoke, keep the default broad target.
    target_modules: all-linear

    lora_adapter_path: null


  actor:
    strategy: fsdp

    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1

    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 4096

    ppo_epochs: 1
    shuffle: false

    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.0

    use_kl_loss: false

    fsdp_config:
      param_offload: true
      optimizer_offload: true

    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: null
      warmup_style: constant


  rollout:
    name: vllm
    mode: async
    dtype: bfloat16

    # LoRA setup:
    # Load the frozen base model directly from the HF checkpoint.
    # Only LoRA adapter weights need trainer -> rollout synchronization.
    load_format: auto

    # Keep GRPO group size intact.
    n: 16

    temperature: 1.0
    top_p: 1.0
    top_k: -1
    do_sample: true

    prompt_length: 2048
    response_length: 512

    # Aggressive memory setting for one-step smoke only.
    gpu_memory_utilization: 0.25

    # 2048 prompt + 512 response = 2560,
    # leave some context margin. 
    max_model_len: 3072     # 3328

    enforce_eager: true
    free_cache_engine: true

    tensor_model_parallel_size: 1
    data_parallel_size: 1

    # Smoke needs only one prompt x four plans.
    max_num_batched_tokens: 3072
    max_num_seqs: 16

    enable_chunked_prefill: true
    enable_prefix_caching: false

    disable_log_stats: true
    calculate_log_probs: true

    checkpoint_engine:
      backend: naive
      update_weights_bucket_megabytes: 32

    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      do_sample: false

# =============================================================================
# GRPO
# =============================================================================

algorithm:

  adv_estimator: grpo

  gamma: 1.0

  lam: 1.0

  norm_adv_by_std_in_grpo: true

  # No KL reward for the Vanilla Planning-RLVR baseline.
  use_kl_in_reward: false


# =============================================================================
# Reward
# =============================================================================

reward:

  # One reward loop worker for:
  #
  #   single GPU
  #   one FrozenCoderWorker
  #   serialized TACO execution
  #
  # More workers would only add contention in the current setup.
  num_workers: 1

  custom_reward_function:
    path: /home/dibaeck/workspace/project_sLM_planning/phase4_method_discovery/vanilla_planning_rlvr/reward/planning_execution_reward.py
    name: compute_score

  reward_manager:
    source: importlib

    name: PlanningRewardManager

    module:
      path: /home/dibaeck/workspace/project_sLM_planning/phase4_method_discovery/vanilla_planning_rlvr/reward/planning_reward_manager.py
      name: PlanningRewardManager

  # We do NOT use verl's native RM.
  #
  # Our reward model is effectively:
  # frozen coder -> TACO execution,
  # and the frozen coder is registered separately in main_ppo_sync.py.
  reward_model:
    enable: false
    enable_resource_pool: false


# =============================================================================
# Critic
# =============================================================================
#
# GRPO does not need a learned critic.
# `need_critic()` should therefore evaluate to false based on adv_estimator=grpo.
# Leave the inherited critic config unused rather than creating a critic worker.
# =============================================================================

trainer:

  device: cuda

  nnodes: 1

  n_gpus_per_node: 1

  project_name: sLM-planning

  experiment_name: vanilla_planning_rlvr_lora_grpo_signal_smoke

  logger:
    - console

  # This is the key smoke-test constraint.
  total_training_steps: 1

  total_epochs: 1

  # Do NOT consume time/VRAM on validation yet.
  val_before_train: false

  val_only: false

  test_freq: -1

  save_freq: -1

  # No checkpoint resume for smoke test.
  resume_mode: disable

  # Actor update immediately.
  critic_warmup: 0

  log_val_generations: 0

  default_local_dir: /mnt/hdd/project_sLM_planning/checkpoints/vanilla_planning_rlvr_lora_grpo_signal_smoke

  default_hdfs_dir: null

transfer_queue:
  enable: true

global_profiler:
  steps: null