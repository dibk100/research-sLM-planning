# phase4_method_discovery/vanilla_planning_rlvr/configs/verl_grpo_smoke.yaml
#
# 1-step integration smoke test for:
#
#   planner rollout
#     -> PlanningRewardManager
#     -> FrozenCoderWorker
#     -> DeepCoder TACO execution
#     -> binary reward
#     -> GRPO advantage
#     -> one actor update
#
# Base: verl release/v0.8.0 ppo_trainer config.

defaults:
  - ppo_trainer
  - _self_


# =============================================================================
# Data
# =============================================================================

data:
  train_files:
    - /mnt/hdd/project_sLM_planning/data/deepcoder_taco/processed/vanilla_planning_rlvr/train.parquet

  val_files:
    - /mnt/hdd/project_sLM_planning/data/deepcoder_taco/processed/vanilla_planning_rlvr/val.parquet

  # One prompt for the smallest possible trainer integration test.
  #
  # rollout.n=4 below means:
  #   1 prompt -> 4 sampled plans
  train_batch_size: 1

  val_batch_size: 1

  # Planner input/output lengths.
  max_prompt_length: 2048
  max_response_length: 512

  # Dataset was already shuffled/split deterministically during build.
  shuffle: true
  validation_shuffle: false

  # Keep preprocessing lightweight for smoke run.
  dataloader_num_workers: 0

  # Avoid unexpected filtering during the integration test.
  filter_overlong_prompts: true
  truncation: error


# =============================================================================
# Planner actor + rollout
# =============================================================================

actor_rollout_ref:

  model:
    path: Qwen/Qwen2.5-Coder-3B-Instruct

    tokenizer_path: Qwen/Qwen2.5-Coder-3B-Instruct

    trust_remote_code: true

    # Important for a single 32 GB GPU.
    enable_gradient_checkpointing: true

    use_remove_padding: true


  # ---------------------------------------------------------------------------
  # Trainable planner
  # ---------------------------------------------------------------------------

  actor:

    strategy: fsdp

    # GRPO smoke:
    # train_batch_size=1 prompt, rollout.n=4.
    #
    # main_ppo_sync internally multiplies this by rollout.n,
    # resulting in 4 plan trajectories for the actor update.
    ppo_mini_batch_size: 1

    ppo_micro_batch_size_per_gpu: 1

    use_dynamic_bsz: true

    # Conservative token budget for one GPU.
    ppo_max_token_len_per_gpu: 4096

    ppo_epochs: 1

    shuffle: false

    grad_clip: 1.0

    clip_ratio: 0.2

    entropy_coeff: 0.0

    # Vanilla GRPO baseline:
    # no explicit KL loss.
    use_kl_loss: false

    optim:
      lr: 1.0e-6

      lr_warmup_steps: 0

      lr_warmup_steps_ratio: 0.0

      min_lr_ratio: null

      warmup_style: constant


  # ---------------------------------------------------------------------------
  # Planner rollout
  # ---------------------------------------------------------------------------

  rollout:

    # vLLM is the rollout backend.
    name: vllm

    # main_ppo_sync uses the async agent-loop infrastructure.
    mode: async

    dtype: bfloat16

    # Research setting:
    # sample four candidate plans per problem.
    n: 4

    temperature: 1.0

    top_p: 1.0

    top_k: -1

    do_sample: true

    prompt_length: 2048

    response_length: 512

    # Critical on the single RTX 5090 because the frozen coder
    # must coexist on the same GPU.
    #
    # Start conservatively. Increase only after the smoke run
    # demonstrates enough free VRAM.
    gpu_memory_utilization: 0.25

    enforce_eager: true

    free_cache_engine: true

    tensor_model_parallel_size: 1

    data_parallel_size: 1

    max_num_batched_tokens: 4096

    max_num_seqs: 8

    enable_chunked_prefill: true

    enable_prefix_caching: false

    disable_log_stats: true

    calculate_log_probs: true

    full_determinism: false

    seed: 42

    # Validation is not actually run in this smoke config,
    # but keep the values deterministic if enabled later.
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      do_sample: false


# =============================================================================
# GRPO
# =============================================================================

algorithm:

  adv_estimator: grpo

  gamma: 1.0

  lam: 1.0

  norm_adv_by_std_in_grpo: true

  # No KL reward for the Vanilla Planning-RLVR baseline.
  use_kl_in_reward: false


# =============================================================================
# Reward
# =============================================================================

reward:

  # One reward loop worker for:
  #
  #   single GPU
  #   one FrozenCoderWorker
  #   serialized TACO execution
  #
  # More workers would only add contention in the current setup.
  num_workers: 1

  custom_reward_function:
    path: /home/dibaeck/workspace/project_sLM_planning/phase4_method_discovery/vanilla_planning_rlvr/reward/planning_execution_reward.py
    name: compute_score

  reward_manager:
    source: importlib

    name: PlanningRewardManager

    module:
      path: /home/dibaeck/workspace/project_sLM_planning/phase4_method_discovery/vanilla_planning_rlvr/reward/planning_reward_manager.py
      name: PlanningRewardManager

  # We do NOT use verl's native RM.
  #
  # Our reward model is effectively:
  # frozen coder -> TACO execution,
  # and the frozen coder is registered separately in main_ppo_sync.py.
  reward_model:
    enable: false
    enable_resource_pool: false


# =============================================================================
# Critic
# =============================================================================
#
# GRPO does not need a learned critic.
# `need_critic()` should therefore evaluate to false based on adv_estimator=grpo.
# Leave the inherited critic config unused rather than creating a critic worker.
# =============================================================================

trainer:

  device: cuda

  nnodes: 1

  n_gpus_per_node: 1

  project_name: sLM-planning

  experiment_name: vanilla_planning_rlvr_grpo_smoke

  logger:
    - console

  # This is the key smoke-test constraint.
  total_training_steps: 1

  total_epochs: 1

  # Do NOT consume time/VRAM on validation yet.
  val_before_train: false

  val_only: false

  test_freq: -1

  save_freq: -1

  # No checkpoint resume for smoke test.
  resume_mode: disable

  # Actor update immediately.
  critic_warmup: 0

  log_val_generations: 0

  default_local_dir: /mnt/hdd/project_sLM_planning/checkpoints/vanilla_planning_rlvr_grpo_smoke

  default_hdfs_dir: null

transfer_queue:
  enable: true

global_profiler:
  steps: null