experiment:
  name: phase1_direct
  seed: 42
dataset:
  name: livecodebench_v6
  split: test
  limit: 10
model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
generation:
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0
strategy:
  name: direct
  prompt_path: prompts/direct.txt
  system_prompt: 'You are an expert competitive programming assistant. Generate correct
    and efficient Python solutions.

    '
evaluation:
  timeout_seconds: 5.0
  include_public_tests: true
  include_private_tests: true
output:
  path: outputs/direct/results.jsonl
  resume: true
