experiment:
  name: phase1_teacher_plan
  seed: 42
dataset:
  name: livecodebench_v6
  split: test
  release_version: release_v6
  test_type: stdin
  limit: 10
model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
generation:
  code_max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0
strategy:
  name: teacher_plan
  plan_path: data/teacher_plans/livecodebench_v6_teacher_plans.jsonl
  code_prompt_path: prompts/teacher_plan_code.txt
  require_verified: false
  system_prompt: 'You are an expert competitive programming assistant. Implement the
    provided expert plan correctly and produce an efficient Python solution.

    '
evaluation:
  timeout_seconds: 5.0
  include_public_tests: true
  include_private_tests: true
output:
  path: outputs/teacher_plan_stdin/results.jsonl
  resume: true
