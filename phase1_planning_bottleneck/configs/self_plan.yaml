experiment:
  name: phase1_self_plan
  seed: 42

dataset:
  name: livecodebench_v6
  split: test
  release_version: release_v6
  test_type: stdin
  limit: 500

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true

generation:
  plan_max_new_tokens: 384        # 384
  code_max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0

strategy:
  name: self_plan
  plan_prompt_path: prompts/self_plan_plan.txt
  code_prompt_path: prompts/self_plan_code.txt
  system_prompt: >
    You are an expert competitive programming assistant.
    Analyze problems carefully and generate correct and efficient Python solutions.

evaluation:
  timeout_seconds: 5.0
  include_public_tests: true
  include_private_tests: true

output:
  path: /mnt/hdd/project_sLM_planning/output_qwen25_3b_inst/self_plan_500_stdin/results.jsonl
  resume: true