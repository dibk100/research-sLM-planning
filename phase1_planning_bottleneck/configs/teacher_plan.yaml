experiment:
  name: phase1_qwen25Coder3b_teacher_plan
  seed: 42

dataset:
  name: livecodebench_v6_stdin
  path: /mnt/hdd/project_sLM_planning/data/livecodebench_v6/stdin
  limit: 300


model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true

generation:
  code_max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0

strategy:
  plan_path: /mnt/hdd/project_sLM_planning/data/teacher_plans/livecodebench_v6/opus5_v1/teacher_plans_300.jsonl
  code_prompt_path: prompt_templates/self_plan_code.txt
