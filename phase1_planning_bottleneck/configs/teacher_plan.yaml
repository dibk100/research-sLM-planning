  system_prompt: >
    You are an expert competitive programming assistant.
    Implement the provided expert plan correctly and produce
    an efficient Python solution.

evaluation:
  timeout_seconds: 6
  include_public_tests: true
  include_private_tests: true
  debug: false

output:
  path: /mnt/hdd/project_sLM_planning/phase1/qwen25Coder3b_re/livecodebench_v6_stdin/teacher_plan/results.jsonl
  resume: true