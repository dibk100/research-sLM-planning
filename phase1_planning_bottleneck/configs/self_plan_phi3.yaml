experiment:
  name: phase1_phi3_self_plan
  seed: 42

dataset:
  name: livecodebench_v6_stdin
  path: /mnt/hdd/project_sLM_planning/data/livecodebench_v6/stdin
  limit: 300

model:
  name_or_path: microsoft/Phi-3.5-mini-instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: false

generation:
  plan_max_new_tokens: 384        # 384
  code_max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0

strategy:
  name: self_plan
  plan_prompt_path: prompt_templates/self_plan_plan.txt
  code_prompt_path: prompt_templates/self_plan_code.txt
  system_prompt: null

evaluation:
  timeout_seconds: 6
  include_public_tests: true
  include_private_tests: true
  debug: false

output:
  path: /mnt/hdd/project_sLM_planning/phase1/livecodebench_v6_stdin/phi3/self_plan/results.jsonl
  resume: true