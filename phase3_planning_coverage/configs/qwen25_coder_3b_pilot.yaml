# Phase 3-A: Self-Planning Best-of-N (full 500 problems)

# Phase 1과 달라지는 유일한 항목: plan sampling.
#   Phase 1  : plan temperature 0.0 (greedy), 문제당 plan 1개
#   Phase 3-A: plan temperature 0.7 / top_p 0.95, 문제당 plan 8개
#   code 생성은 Phase 1과 동일하게 greedy로 둔다.
#   (candidate 간 차이를 'plan의 차이'로 귀속시키기 위함)

experiment:
  name: phase3a_planning_coverage_pilot
  seed: 42

dataset:
  name: livecodebench_v6
  split: test
  release_version: release_v6
  test_type: stdin
  limit: 10

model:
  name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: False

sampling:
  # N=8까지 한 번만 생성한다.
  # N=1,2,4는 분석 단계에서 candidate prefix로 얻는다.
  num_samples: 8

generation:
  plan:
    max_new_tokens: 512        # 384, 512
    temperature: 0.7           # Phase 3-A의 유일한 핵심 변경
    top_p: 0.95
  code:
    max_new_tokens: 1024       # Phase 1과 동일
    temperature: 0.0           # greedy, Phase 1과 동일
    top_p: 1.0

strategy:
  name: self_plan_best_of_n
  # 프롬프트는 phase1_planning_bottleneck/prompts/ 에서 직접 읽는다.
  # (src/prompts.py가 파일명을 Phase 1 디렉터리 기준으로 해석한다.)
  plan_prompt_path: self_plan_plan.txt
  code_prompt_path: self_plan_code.txt
  system_prompt: >
    You are an expert competitive programming assistant.
    Analyze problems carefully and generate correct and efficient Python solutions.

evaluation:
  timeout_seconds: 5.0
  include_public_tests: true
  include_private_tests: true

output:
  path: /mnt/hdd/project_sLM_planning/output_phase3/qwen25_coder_3b/best_of_8_pilot_512/results.jsonl
  resume: true

  # 문제당 candidate가 8개라 프롬프트/테스트 상세를 모두 저장하면 용량이 폭증한다.
  # (Phase 1 self_plan 500문제 results.jsonl 이 test_results 포함 8.5GB였다.)
  # full run에서는 끄고, sanity run에서만 켠다.
  store_prompts: true
  store_test_results: false
