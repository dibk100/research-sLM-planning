experiment:
  name: phase3a_qwen253b_planning_coverage
  seed: 42

dataset:
  name: livecodebench_v6_stdin
  path: /mnt/hdd/project_sLM_planning/data/livecodebench_v6/stdin
  limit: 300

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true

sampling:
  num_samples: 16

generation:
  plan:
    max_new_tokens: 384        # Phase 1과 동일
    temperature: 0.7           # Phase 3-A의 유일한 핵심 변경
    top_p: 0.95
  code:
    max_new_tokens: 1024       # Phase 1과 동일
    temperature: 0.0           # greedy, Phase 1과 동일
    top_p: 1.0

strategy:
  name: planning_coverage
  plan_prompt_path: prompt_templates/self_plan_plan.txt
  code_prompt_path: prompt_templates/self_plan_code.txt
  system_prompt: null

evaluation:
  timeout_seconds: 6
  debug: false
  include_public_tests: true
  include_private_tests: true

output:
  path: /mnt/hdd/project_sLM_planning/phase3/livecodebench_v6_stdin/qwen253b/planning_coverage/results.jsonl
  resume: true
  store_prompts: false
  store_test_results: false