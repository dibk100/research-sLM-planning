experiment:
  name: phase3a_qwen253b_code_coverage
  seed: 42

dataset:
  name: livecodebench_v6_stdin
  path: /mnt/hdd/project_sLM_planning/data/livecodebench_v6/stdin
  limit: 300

phase1:
  self_plan_result_path: /mnt/hdd/project_sLM_planning/phase1/livecodebench_v6_stdin/qwen253b/self_plan/results.jsonl

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true

sampling:
  num_samples: 16

generation:
  code:
    max_new_tokens: 1024
    temperature: 0.7
    top_p: 0.95

strategy:
  name: code_coverage
  code_prompt_path: prompt_templates/self_plan_code.txt
  system_prompt: null

evaluation:
  timeout_seconds: 6
  debug: false
  include_public_tests: true
  include_private_tests: true

output:
  path: /mnt/hdd/project_sLM_planning/phase3/livecodebench_v6_stdin/qwen253b/code_coverage/results.jsonl
  resume: true
  store_prompts: false
  store_test_results: false